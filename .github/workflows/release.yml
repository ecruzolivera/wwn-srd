name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markpublisher
        run: npm install -g markpublisher

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build book
        run: markpublisher build

      - name: Attach PDF and HTML to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.pdf
            output/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
